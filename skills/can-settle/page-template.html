<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:var(--font-sans);color:var(--foreground);font-size:14px}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--border);background:var(--card);color:var(--card-foreground);padding:6px 12px;border-radius:var(--radius);cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted-foreground);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}tr:hover td{background:var(--accent-surface)}
.muted{color:var(--muted-foreground)}h3{margin:18px 0 6px;font-size:13px;font-weight:600}
.maybe td{color:var(--muted-foreground)}
details{margin-top:14px;color:var(--muted-foreground);font-size:13px}summary{cursor:pointer}details p{margin:6px 0 0}
#out{display:none;width:100%;height:110px;margin-top:8px;background:var(--code-background);color:var(--code-foreground);border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-family:var(--font-mono);font-size:12px}
#msg{color:var(--muted-foreground);font-size:12px}
</style></head><body>
<div class="bar"><button id="all">Select all</button><button id="none">Clear</button>
<button class="primary" id="copy" disabled>Copy selection (0)</button><button id="dl" disabled>Download .txt</button><span id="msg"></span></div>
<p id="sum" class="muted"><!-- SUMMARY: one sentence, e.g. You can clear N of M sidebar threads; K are your call; the rest need something. --></p>
<h3>Can settle</h3>
<table class="pick"><thead><tr><th></th><th>Thread</th><th>Why</th><th>Updated</th></tr></thead><tbody>
<!-- ROWS_SETTLE, one per thread, escaped text, reason of two or three short sentences:
<tr><td><input type="checkbox" data-id="THREAD_ID" data-t="TITLE"></td><td>TITLE</td><td>REASON</td><td class="muted">MM-DD HH:MM</td></tr> -->
</tbody></table>
<h3>Maybe, your call</h3>
<table class="pick maybe"><tbody>
<!-- ROWS_MAYBE, same row shape, reason of two short sentences, unchecked -->
</tbody></table>
<h3>Needs attention</h3>
<table class="attn"><tbody>
<!-- ROWS_NEEDS: <tr><td style="width:28px"></td><td>TITLE</td><td class="why">WHAT IT NEEDS AND FROM WHOM</td><td class="muted">MM-DD HH:MM</td></tr> -->
</tbody></table>
<textarea id="out" readonly></textarea>
<script>
const boxes=[...document.querySelectorAll('.pick input')];const copy=document.getElementById('copy'),dl=document.getElementById('dl'),msg=document.getElementById('msg'),out=document.getElementById('out');
const sel=()=>boxes.filter(b=>b.checked);
const text=()=>"Please settle these threads (chosen in /can-settle). Do it yourself and record what you settled:\n"+sel().map(b=>"- "+b.dataset.t+" ["+b.dataset.id+"]").join("\n");
function upd(){const n=sel().length;copy.textContent="Copy selection ("+n+")";copy.disabled=dl.disabled=n===0}
boxes.forEach(b=>b.onchange=upd);
document.getElementById('all').onclick=()=>{document.querySelectorAll('table.pick:not(.maybe) input').forEach(b=>b.checked=true);upd()};
document.getElementById('none').onclick=()=>{boxes.forEach(b=>b.checked=false);upd()};
copy.onclick=async()=>{const t=text();try{await navigator.clipboard.writeText(t);msg.textContent="Copied. Paste it in the chat."}catch(e){out.style.display='block';out.value=t;out.select();msg.textContent="Select and copy the text below."}};
dl.onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text()],{type:'text/plain'}));a.download='settle-selection.txt';a.click()}catch(e){msg.textContent="Download blocked here; use Copy."}};
</script></body></html>
